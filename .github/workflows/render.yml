name: Render Ventilador Video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render MP4 (1080x1920, 90s)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome dependencies
        uses: browser-actions/setup-chrome@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb ffmpeg

      - name: Install Python dependencies
        run: |
          pip3 install numpy scipy soundfile Pillow edge-tts --break-system-packages

      - name: Install npm dependencies
        run: npm ci

      - name: Verify TypeScript compiles
        run: npx tsc --noEmit

      - name: Generate narration audio
        run: |
          python scripts/voiceover.py --lines scripts/narration.json --provider edge --voice pt-BR-AntonioNeural --rate +20%
          python scripts/prepare_vo_simple.py

      - name: Convert audio to WAV
        run: |
          mkdir -p public/audio/vo
          for f in public/audio/vo/*.mp3; do
            [ -f "$f" ] && ffmpeg -y -i "$f" -ar 48000 -ac 1 "${f%.mp3}.wav"
          done

      - name: Generate SFX
        run: |
          python scripts/sfx.py

      - name: Generate music
        run: |
          python scripts/music.py

      - name: Verify TypeScript compiles (after audio generation)
        run: npx tsc --noEmit

      - name: Render video with Remotion
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            npx remotion render Ventilador out/ventilador-raw.mp4 \
              --concurrency=1 \
              --crf=30 \
              --timeout=900000

      - name: Check video metadata
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration out/ventilador-raw.mp4

      - name: Normalize loudness (-14 LUFS)
        run: |
          python scripts/loudnorm.py out/ventilador-raw.mp4 out/ventilador.mp4

      - name: Verify final video
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration out/ventilador.mp4
          python scripts/audiocheck.py out/ventilador.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventilador-final
          path: out/ventilador.mp4
          retention-days: 30

      - name: Upload raw video (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ventilador-raw
          path: out/ventilador-raw.mp4
          retention-days: 7