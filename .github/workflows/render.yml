name: Render Ventilador Video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render MP4 (1080x1920, 90s)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chrome dependencies
        uses: browser-actions/setup-chrome@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            xvfb \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libatspi2.0-0 \
            libxshmfence1 libxss1 libxtst6 \
            ffmpeg python3 python3-pip

      - name: Install Python dependencies
        run: |
          pip3 install numpy scipy soundfile Pillow --break-system-packages

      - name: Install npm dependencies
        run: npm ci

      - name: Verify TypeScript compiles
        run: npx tsc --noEmit

      - name: Render video with Remotion (with xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            npx remotion render Ventilador out/ventilador-raw.mp4 \
              --gl=angle \
              --concurrency=2 \
              --crf=23 \
              --timeout=300000

      - name: Check video metadata
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration out/ventilador-raw.mp4

      - name: Normalize loudness (-14 LUFS)
        run: |
          python scripts/loudnorm.py out/ventilador-raw.mp4 out/ventilador.mp4

      - name: Verify final video
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration out/ventilador.mp4
          python scripts/audiocheck.py out/ventilador.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventilador-final
          path: out/ventilador.mp4
          retention-days: 30

      - name: Upload raw video (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ventilador-raw
          path: out/ventilador-raw.mp4
          retention-days: 7